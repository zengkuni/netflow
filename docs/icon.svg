<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243427"/>
      <stop offset="1" stop-color="#18211B"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8D5B5"/>
      <stop offset="1" stop-color="#6B9B74"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square base, warm dark moss: the app's default-dark canvas. -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer ring suggesting "network / signal", foliage green. -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#4E7A57" stroke-width="6" opacity="0.75"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#4E7A57" stroke-width="3" opacity="0.45"/>

  <!-- Lightning bolt, the Netflow brand mark. -->
  <path d="M286,124 L188,290 L246,290 L226,388 L324,222 L266,222 Z"
        fill="url(#bolt)"
        stroke="#18211B"
        stroke-width="2"
        stroke-linejoin="round"/>
</svg>
