name: Release

# Fires on a version tag push (v1.0.0, v1.0.1, ...): builds the release APK,
# signs it when keystore secrets are present, and creates the matching GitHub
# Release with Netflow-v<version>.apk attached. The tag (minus the leading v)
# must match app/build.gradle.kts versionName, the build fails otherwise.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 36 / build-tools 36.x are not in the runner image yet.
      - name: Install platform and build-tools 36
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore (only when secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.NETFLOW_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NETFLOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NETFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NETFLOW_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/netflow-release.jks

      # build.gradle.kts reads these env vars; unset = unsigned APK, which
      # still installs but cannot upgrade in place.
      - name: Build release APK
        env:
          NETFLOW_KEYSTORE_PASSWORD: ${{ secrets.NETFLOW_KEYSTORE_PASSWORD }}
          NETFLOW_KEY_ALIAS: ${{ secrets.NETFLOW_KEY_ALIAS }}
          NETFLOW_KEY_PASSWORD: ${{ secrets.NETFLOW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Check tag matches versionName
        id: meta
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APK_VERSION=$("$AAPT" dump badging app/build/outputs/apk/release/app-release.apk \
            | grep -oP "versionName='\K[^']+")
          echo "tag=$TAG_VERSION apk=$APK_VERSION"
          if [ "$APK_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${APK_VERSION}; bump app/build.gradle.kts first"
            exit 1
          }

      - name: Rename APK for release
        run: |
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Netflow-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Netflow ${{ github.ref_name }}"
          files: app/build/outputs/apk/release/Netflow-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
