name: Release

# Fires on a version tag push (v1.0.0, v1.0.1, ...): builds the release APK,
# signs it when keystore secrets are present, and creates the matching GitHub
# Release with Netflow-v<version>.apk attached. The tag (minus the leading v)
# must match app/build.gradle.kts versionName, the build fails otherwise.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android cmdline-tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # Separate step on purpose: GITHUB_PATH only reaches the steps after
      # the one that writes it, so sdkmanager is not on PATH inside the
      # step that installs it.
      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          # compileSdk 36 / build-tools 36.x: the app needs both.
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Decode keystore (only when secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.NETFLOW_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/netflow-release.jks

      # build.gradle.kts reads these env vars; unset = unsigned APK, which
      # still installs but cannot upgrade in place.
      - name: Build release APK
        env:
          NETFLOW_KEYSTORE_PASSWORD: ${{ secrets.NETFLOW_KEYSTORE_PASSWORD }}
          NETFLOW_KEY_ALIAS: ${{ secrets.NETFLOW_KEY_ALIAS }}
          NETFLOW_KEY_PASSWORD: ${{ secrets.NETFLOW_KEY_PASSWORD }}
        # chmod guards filesystems that drop the exec bit on checkout
        # (Windows worktrees, act's docker cp); harmless where it is set.
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Resolve APK path
        # Signed builds emit app-release.apk, unsigned ones
        # app-release-unsigned.apk; glob handles both.
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::no release APK under app/build/outputs/apk/release/"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "apk=$APK"

      - name: Check tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          APK_VERSION=$("$AAPT" dump badging "$APK_PATH" \
            | grep -oP "versionName='\K[^']+")
          echo "tag=$TAG_VERSION apk=$APK_VERSION"
          if [ "$APK_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName ${APK_VERSION}; bump app/build.gradle.kts first"
            exit 1
          fi

      - name: Rename APK for release
        run: |
          cp "$APK_PATH" "app/build/outputs/apk/release/Netflow-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Netflow ${{ github.ref_name }}"
          files: app/build/outputs/apk/release/Netflow-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
